<script>
const MENU=[
{id:'panini',name:'Panini poulet',p:25,c:'Plats',badge:'Populaire',emoji:'🥪',desc:'Poulet mariné, fromage fondant et sauce maison.',ing:'Poulet · Fromage · Pain grillé'},
{id:'tacos',name:'Tacos poulet',p:30,c:'Plats',badge:'Populaire',emoji:'🌮',desc:'Tortilla généreuse, poulet, frites et sauce.',ing:'Poulet · Tortilla · Frites'},

{id:'salade',name:'Salade fraîche',p:22,c:'Plats',badge:'Nouveau',emoji:'🥗',desc:'Une salade colorée, fraîche et pleine de saveurs.',ing:'Laitue · Tomate · Concombre'},

let db,pg='home',cat='Tout',q='',detail=null,dq=1,extras=[],slot=-1,promo='',pay='Espèces',admin=false,af='Toutes',lastOrder=null;
function fresh(){return{cart:[],orders:[],events:[],welcomeUsed:false,email:'istapetit.demo@gmail.com',recovered:0,orderNo:1,loyaltyUsed:0};}
function load(){try{return Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return fresh()}}
db=load();function save(){localStorage.setItem(KEY,JSON.stringify(db))}function log(s){db.events.unshift({at:new Date().toISOString(),s:s});db.events=db.events.slice(0,400);save()}
function h(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function m(n){return Number(n||0).toFixed(2).replace(/\.00$/,'')+' DH'}function item(id){return MENU.find(x=>x.id===id)||MENU[0]}function qty(){return db.cart.reduce((a,x)=>a+x.qty,0)}function sub(){return db.cart.reduce((a,x)=>a+x.p*x.qty,0)}function toast(s){document.getElementById('toastroot').innerHTML='<div class="toast">'+h(s)+'</div>';setTimeout(()=>document.getElementById('toastroot').innerHTML='',2300)}

function openDish(id){detail=id;dq=1;extras=[];let x=item(id);document.getElementById('modalroot').innerHTML='<div class="modalbg" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true"><button class="x" onclick="closeModal()">×</button><div class="foodpic">'+x.emoji+'</div><h2>'+h(x.name)+'</h2><p class="desc">'+h(x.desc)+'</p><p class="muted">Ingrédients : '+h(x.ing)+'</p><h3>Personnalise ton plat</h3><div class="extra"><label><input type="checkbox" onchange="extraToggle(\'fromage\',this.checked)"> Extra fromage</label><b>+3 DH</b></div><div class="extra"><label><input type="checkbox" onchange="extraToggle(\'sauce\',this.checked)"> Sauce supplémentaire</label><b>+2 DH</b></div><div style="display:flex;gap:9px;align-items:center;margin-top:15px"><div class="qty"><button onclick="dq=Math.max(1,dq-1);updateModal()">−</button><span id="dqty">1</span><button onclick="dq=Math.min(20,dq+1);updateModal()">+</button></div><button class="btn" style="flex:1" onclick="addItem()">Ajouter · <span id="dtotal">'+m(x.p)+'</span></button></div></section></div>'}
function closeModal(){detail=null;document.getElementById('modalroot').innerHTML=''}function extraToggle(id,on){let o={fromage:{id:'fromage',name:'Extra fromage',p:3},sauce:{id:'sauce',name:'Sauce supplémentaire',p:2}}[id];extras=on?[...extras.filter(x=>x.id!==id),o]:extras.filter(x=>x.id!==id);updateModal()}
function updateModal(){document.getElementById('dqty').textContent=dq;document.getElementById('dtotal').textContent=m((item(detail).p+extras.reduce((a,x)=>a+x.p,0))*dq)}
function addItem(){let x=item(detail),p=x.p+extras.reduce((a,e)=>a+e.p,0),newLine={id:x.id,p:p,qty:dq,extras:extras.map(e=>({id:e.id,name:e.name,p:e.p}))},key=newLine.id+'|'+newLine.extras.map(e=>e.id).sort().join(','),old=db.cart.find(y=>y.id+'|'+y.extras.map(e=>e.id).sort().join(',')===key);if(old)old.qty=Math.min(20,old.qty+dq);else db.cart.push(newLine);save();closeModal();render();toast('Ajouté au panier 🍽️')}
function cartPage(){if(!db.cart.length)return '<div class="heading"><h1>Mon panier 🛍️</h1><p>Ta prochaine pause gourmande commence ici.</p></div><div class="card empty"><div class="emoji">🥡</div><h3>Ton panier est encore vide</h3><p>Ajoute un plat qui te fait envie et reviens valider ta commande.</p><button class="btn" onclick="go(\'home\')">Découvrir le menu →</button></div>'+footer();let rows=db.cart.map((x,i)=>'<div class="line"><div class="thumb">'+item(x.id).emoji+'</div><div><h4>'+h(item(x.id).name)+'</h4><div class="meta">'+(x.extras.length?x.extras.map(e=>h(e.name)).join(', '):'Classique')+'</div><div class="qty"><button onclick="cartQty('+i+',-1)">−</button><span>'+x.qty+'</span><button onclick="cartQty('+i+',1)">+</button></div></div><div class="end"><div class="lineTotal">'+m(x.p*x.qty)+'</div><button class="remove" onclick="removeLine('+i+')">Retirer</button></div></div>').join('');let valid=promo==='valid'&&!db.welcomeUsed&&db.orders.length===0,discount=valid?sub()*.5:0,total=sub()-discount;return '<div class="heading"><h1>Mon panier 🛍️</h1><p>'+qty()+' article(s) sélectionné(s) · prêt pour ta pause ?</p></div><section class="card"><h3>Ta sélection</h3>'+rows+'</section><section class="card"><h3>Un code promo ? 🎁</h3><div class="inline"><input id="promoInput" placeholder="BIENVENUE" value="'+(promo==='valid'?'BIENVENUE':'')+'" style="flex:1;width:40%;min-width:0;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:11px"><button class="btn dark" onclick="applyPromo()">Appliquer</button></div>'+(promo==='valid'&&valid?'<p class="green muted">✓ −50 % appliqué sur ta première commande.</p>':promo==='used'?'<p class="error">Code réservé à ta première commande.</p>':promo==='invalid'?'<p class="error">Code non reconnu.</p>':'')+'</section><section class="card"><h3>Récapitulatif</h3><div class="totals"><div class="total"><span>Sous-total</span><span>'+m(sub())+'</span></div>'+(discount?'<div class="total green"><span>Bienvenue · −50 %</span><span>−'+m(discount)+'</span></div>':'')+'<div class="total"><span>Retrait à l’ISTA</span><span class="green">Gratuit</span></div><div class="total final"><span>Total à payer</span><span>'+m(total)+'</span></div></div></section><section class="card"><h3>Où et quand récupérer ?</h3><div class="field"><label>Ton prénom et nom</label><input id="customer" placeholder="Ex. Salma Benali"></div><div class="field"><label>Choisis un créneau</label><div class="slots">'+SLOTS.map((s,i)=>{let n=db.orders.filter(o=>o.slot===s&&o.status!=='Annulée').length,r=8-n;return '<button class="slot '+(slot===i?'on':'')+'" '+(!r?'disabled':'')+' onclick="slot='+i+';render()">'+s+'<small>'+(r?r+' places restantes':'Complet')+'</small></button>'}).join('')+'</div></div><div class="field"><label>Mode de paiement</label><div class="pay"><label><input type="radio" name="pay" value="Espèces" '+(pay==='Espèces'?'checked':'')+' onchange="pay=this.value"> 💵 Espèces au comptoir</label><label><input type="radio" name="pay" value="Carte" '+(pay==='Carte'?'checked':'')+' onchange="pay=this.value"> 💳 Carte au comptoir</label></div></div><button class="btn full" onclick="placeOrder()">Confirmer la commande · '+m(total)+' →</button><p class="muted" style="line-height:1.6;text-align:center">Le paiement se fera au comptoir. Aucun paiement en ligne.</p></section>'+footer()}
function cartQty(i,d){db.cart[i].qty+=d;if(db.cart[i].qty<1)db.cart.splice(i,1);save();render()}function removeLine(i){db.cart.splice(i,1);save();render();toast('Article retiré')}function applyPromo(){let v=(document.getElementById('promoInput').value||'').trim().toUpperCase();if(v==='BIENVENUE'&&db.orders.length===0&&!db.welcomeUsed){promo='valid';toast('Code activé : −50 %')}else if(v==='BIENVENUE'){promo='used';toast('Offre première commande uniquement')}else{promo='invalid';toast('Code non reconnu')}render()}
function placeOrder(){let name=(document.getElementById('customer').value||'').trim();if(!name){toast('Indique ton prénom et ton nom');return}if(slot<0){toast('Choisis un créneau de retrait');return}let s=SLOTS[slot];if(db.orders.filter(o=>o.slot===s&&o.status!=='Annulée').length>=8){toast('Ce créneau est complet');render();return}let valid=promo==='valid'&&db.orders.length===0&&!db.welcomeUsed,subtotal=sub(),discount=valid?subtotal*.5:0,order={id:'CMD-'+String(db.orderNo).padStart(4,'0'),code:String(Math.floor(1000+Math.random()*9000)),name:name,items:db.cart.map(x=>({id:x.id,name:item(x.id).name,qty:x.qty,p:x.p,extras:x.extras})),subtotal:subtotal,discount:discount,total:subtotal-discount,payment:pay,slot:s,status:'Reçue',at:new Date().toISOString()};db.orderNo++;db.orders.unshift(order);if(valid)db.welcomeUsed=true;db.cart=[];promo='';slot=-1;lastOrder=order;log('Nouvelle commande '+order.id+' · '+name+' · '+m(order.total));pg='confirmation';render();window.scrollTo(0,0)}
function receipt(o){return "ISTA'Pétit — Clique. Récupère. Mange.\\nREÇU DE COMMANDE\\nCommande : "+o.id+"\\nCode de retrait : "+o.code+"\\nClient : "+o.name+"\\nCréneau : "+o.slot+"\\nDate : "+new Date(o.at).toLocaleString('fr-FR')+"\\nPaiement : "+o.payment+" au comptoir\\n\\n"+o.items.map(i=>i.qty+' × '+i.name+' — '+m(i.p*i.qty)).join('\\n')+"\\n\\nSous-total : "+m(o.subtotal)+"\\nRéductions : "+m(o.discount)+"\\nTOTAL : "+m(o.total)+"\\n\\nPrototype étudiant — reçu non fiscal."}
function download(name,text){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function getOrder(id){return db.orders.find(o=>o.id===id)||lastOrder}function saveReceipt(id){let o=getOrder(id);if(o)download('recu-'+o.id+'.txt',receipt(o))}
function totalsHTML(o){return '<div class="totals"><div class="total"><span>Sous-total</span><span>'+m(o.subtotal)+'</span></div>'+(o.discount?'<div class="total green"><span>Réduction</span><span>−'+m(o.discount)+'</span></div>':'')+'<div class="total final"><span>Total à payer</span><span>'+m(o.total)+'</span></div></div>'}
function confirmation(){let o=lastOrder||db.orders[0];if(!o)return ordersPage();return '<div class="success"><div class="check">✓</div><h1>Commande confirmée !</h1><p>Merci '+h(o.name)+'. On s’occupe de tout 💛</p></div><section class="card"><div style="display:flex;justify-content:space-between"><b>'+o.id+'</b><span class="status">'+o.status+'</span></div><div class="code"><div><span class="muted">Ton code de retrait</span><br><span class="muted">À présenter au comptoir</span></div><strong>'+o.code+'</strong></div><p class="muted" style="line-height:1.8">'+o.items.map(i=>i.qty+' × '+h(i.name)+' — '+m(i.qty*i.p)).join('<br>')+'<br>Créneau : '+h(o.slot)+'<br>Paiement : '+h(o.payment)+' au comptoir</p>'+totalsHTML(o)+'<button class="btn light full" onclick="saveReceipt(\''+o.id+'\')">⇩ Télécharger le reçu</button></section><button class="btn full" onclick="lastOrder=null;go(\'orders\')">Suivre ma commande →</button><button class="btn light full" style="margin-top:8px" onclick="lastOrder=null;go(\'home\')">Retour à l’accueil</button>'+footer()}
function statusClass(s){return s==='Récupérée'?'done':s==='Prête'?'ready':s==='En préparation'?'prep':s==='Annulée'?'cancel':''}
function sendOrderMail(id){let o=getOrder(id);if(!o)return;location.href='mailto:'+encodeURIComponent(db.email)+'?subject='+encodeURIComponent("ISTA'Pétit — commande "+o.id)+'&body='+encodeURIComponent(receipt(o))}
function orderCard(o){return '<section class="card"><div style="display:flex;justify-content:space-between;gap:7px"><div><b style="font-size:11px">'+o.id+'</b><div class="muted">'+new Date(o.at).toLocaleString('fr-FR')+'</div></div><span class="status '+statusClass(o.status)+'">'+o.status+'</span></div><p class="muted" style="line-height:1.8">'+o.items.map(i=>i.qty+' × '+h(i.name)).join(' · ')+'<br>Retrait : '+h(o.slot)+' · Total : <b>'+m(o.total)+'</b></p>'+(o.status!=='Annulée'?ST.map((s,i)=>'<div class="track '+(ST.indexOf(o.status)>=i?'done':'')+'"><span class="dot">'+(ST.indexOf(o.status)>=i?'✓':i+1)+'</span><div><strong>'+s+'</strong><small>'+['Commande reçue','Préparation en cours','Tu peux bientôt la récupérer','Présente ton code de retrait'][i]+'</small></div></div>').join(''):'')+'<div style="display:flex;gap:7px"><button class="btn light" onclick="saveReceipt(\''+o.id+'\')">⇩ Reçu</button><button class="btn light" onclick="sendOrderMail(\''+o.id+'\')">✉ E-mail</button></div></section>'}
function ordersPage(){let progress=db.recovered%10;return '<div class="heading"><h1>Mes commandes 🧾</h1><p>Retrouve tes commandes et suis leur préparation.</p></div><section class="loyal"><h3>⭐ Ma carte fidélité <span style="float:right">'+progress+'/10</span></h3><p>10 commandes récupérées = la suivante offerte. Merci pour ta fidélité !</p><div class="loyalgrid">'+Array.from({length:10},(_,i)=>'<span class="'+(i<progress?'filled':'')+'">'+(i<progress?'✓':i+1)+'</span>').join('')+'</div></section>'+(db.orders.length?'<div class="row"><h2>Mon historique</h2><span class="muted">'+db.orders.length+' commande(s)</span></div>'+db.orders.map(orderCard).join(''):'<section class="card empty"><div class="emoji">🧾</div><h3>Pas encore de commande</h3><p>Ta première commande apparaîtra ici avec son suivi.</p><button class="btn" onclick="go(\'home\')">Voir le menu →</button></section>')+footer()}
function doLogin(){let email=(document.getElementById('adminemail').value||'').trim(),code=document.getElementById('admincode').value;if(!/^[^\\s@]+@gmail\\.com$/i.test(email)){toast('Utilise une adresse Gmail valide');return}if(code!=='admin123'){toast('Code d’accès incorrect');return}admin=true;db.email=email;log('Connexion Admin depuis '+email);render()}
function setStatus(id,next){let o=getOrder(id);if(!o)return;let prev=o.status;if(prev==='Annulée'){toast('Commande déjà annulée');return}if(next==='Annulée'){if(prev==='Récupérée'){toast('Commande récupérée non annulable');return}o.status=next}else{if(ST.indexOf(next)<ST.indexOf(prev)){toast('Le statut ne peut pas revenir en arrière');return}o.status=next;if(next==='Récupérée'&&prev!=='Récupérée')db.recovered++}o.updated=new Date().toISOString();log('Commande '+id+' : '+prev+' → '+o.status);render();toast('Commande mise à jour')}
function journal(){return "JOURNAL ISTA'Pétit — "+new Date().toLocaleString('fr-FR')+"\\n"+'='.repeat(45)+"\\n"+db.events.map(e=>'['+new Date(e.at).toLocaleString('fr-FR')+'] '+e.s).join('\\n')}
function gmailJournal(){let e=(document.getElementById('jemail').value||db.email).trim();if(!/^[^\\s@]+@gmail\\.com$/i.test(e)){toast('Adresse Gmail invalide');return}db.email=e;save();location.href='https://mail.google.com/mail/?view=cm&fs=1&to='+encodeURIComponent(e)+'&su='+encodeURIComponent("Journal d'événements — ISTA'Pétit")+'&body='+encodeURIComponent(journal())}
function adminPage(){if(!admin)return '<div class="heading"><h1>Espace équipe 🔐</h1><p>Connecte-toi pour gérer les commandes.</p></div><section class="card" style="text-align:center"><div style="font-size:38px">🔐</div><h2 style="font-size:17px">Connexion Admin</h2><p class="muted">Compte de démonstration</p><div class="field" style="text-align:left"><label>Adresse Gmail</label><input id="adminemail" type="email" value="'+h(db.email)+'" placeholder="tonadresse@gmail.com"></div><div class="field" style="text-align:left"><label>Code d’accès</label><input id="admincode" value="admin123" type="password"></div><p style="background:#fff2df;border-radius:10px;padding:10px;font-size:10px">Code de démonstration : <b>admin123</b></p><button class="btn full" onclick="doLogin()">Se connecter →</button><p class="muted">Prototype étudiant : connexion non sécurisée.</p></section>'+footer();
let recv=db.orders.filter(o=>o.status==='Reçue').length,prep=db.orders.filter(o=>o.status==='En préparation').length,ready=db.orders.filter(o=>o.status==='Prête').length,sales=db.orders.filter(o=>o.status!=='Annulée').reduce((a,o)=>a+o.total,0),list=db.orders.filter(o=>af==='Toutes'||o.status===af);
return '<div class="heading"><h1>Tableau de bord 📊</h1><p>Gestion des commandes · données locales de démonstration</p></div><section class="adminHero"><span class="muted" style="color:#ffb65e">ISTA'+"'Pétit · GESTION"+'</span><h2>Salut, l’équipe 👋</h2><p>Connecté : '+h(db.email)+'</p><button class="btn light" style="margin-top:10px" onclick="admin=false;render()">Se déconnecter</button></section><div class="stats"><div class="stat">📥<strong>'+recv+'</strong><span>Commandes reçues</span></div><div class="stat">👨‍🍳<strong>'+prep+'</strong><span>En préparation</span></div><div class="stat">✅<strong>'+ready+'</strong><span>Prêtes à retirer</span></div><div class="stat">💰<strong style="font-size:16px">'+m(sales)+'</strong><span>Ventes hors annulations</span></div></div><div class="row"><h2>Les commandes</h2><span class="muted">'+db.orders.length+' au total</span></div><div class="filter">'+['Toutes',...ST,'Annulée'].map(s=>'<button class="chip '+(af===s?'on':'')+'" onclick="af=\''+s+'\';render()">'+s+'</button>').join('')+'</div>'+(list.length?list.map(o=>'<section class="card"><div style="display:flex;justify-content:space-between"><div><b style="font-size:11px">'+h(o.name)+'</b><div class="muted">'+o.id+'</div></div><span class="status '+statusClass(o.status)+'">'+o.status+'</span></div><p class="muted" style="line-height:1.8">'+o.items.map(i=>i.qty+' × '+h(i.name)).join(' · ')+'<br>Créneau : '+h(o.slot)+'<br>Total : <b>'+m(o.total)+'</b> · Code : <b>'+o.code+'</b></p><div class="adminAction"><select id="s-'+o.id+'">'+[...ST,'Annulée'].map(s=>'<option '+(s===o.status?'selected':'')+'>'+s+'</option>').join('')+'</select><button onclick="setStatus(\''+o.id+'\',document.getElementById(\'s-'+o.id+'\').value)">Mettre à jour</button></div><button class="btn light" style="margin-top:7px" onclick="sendOrderMail(\''+o.id+'\')">✉ E-mail commande</button></section>').join(''):'<div class="card muted">Aucune commande dans ce filtre.</div>')+'<section class="card"><h3>✉ Journal et e-mail</h3><p class="muted" style="line-height:1.7">Gmail s’ouvre avec le journal prérempli ; l’envoi doit être confirmé dans Gmail.</p><div class="field"><label>Adresse Gmail de destination</label><input id="jemail" type="email" value="'+h(db.email)+'"></div><button class="btn full" onclick="gmailJournal()">Envoyer le journal via Gmail</button><button class="btn light full" style="margin-top:8px" onclick="download(\'journal-istapetit.txt\',journal())">⇩ Télécharger journal .txt</button><div class="row"><h2>Derniers événements</h2><span class="muted">'+db.events.length+'</span></div>'+(db.events.slice(0,12).map(e=>'<div class="journal"><small>'+new Date(e.at).toLocaleString('fr-FR')+'</small><p>'+h(e.s)+'</p></div>').join('')||'<p class="muted">Aucun événement pour le moment.</p>')+'</section><div class="warn">Données locales à cet appareil. Sans backend, les téléphones ne partagent pas les commandes. Le code Admin est visible côté client et ne doit pas protéger de données réelles.</div>'+footer()}
function render(){db=load();let main=document.getElementById('main');main.innerHTML=pg==='home'?home():pg==='cart'?cartPage():pg==='orders'?ordersPage():pg==='confirmation'?confirmation():adminPage();countNav()}
window.addEventListener('storage',e=>{if(e.key===KEY)render()});render();
</script></body></html>
